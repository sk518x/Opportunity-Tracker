<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunity Dashboard</title>
<style>
  :root {
    --paper: #EFF1F5;
    --ink: #1F2430;
    --muted: #6B7080;
    --line: #D6D9E0;
    --card: #FFFFFF;
    --red-bg: #FBE3DF; --red-fg: #A3401F;
    --amber-bg: #FBEACB; --amber-fg: #8A5A0A;
    --teal-bg: #DCEDE8; --teal-fg: #2E6B5E;
    --grey-bg: #E6E7EC; --grey-fg: #5A5F6E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  .eyebrow {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
  }
  h1 { font-size: 28px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; text-align: center;
  }
  .stat-number {
    display: block; font-size: 24px; font-weight: 700; font-family: Georgia, serif;
  }
  .stat-label {
    display: block; margin-top: 4px; font-size: 12px; color: var(--muted);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  select, input[type=text] {
    font-family: inherit; font-size: 13px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--ink);
  }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .pill {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12.5px; font-weight: 500;
    border-radius: 999px; padding: 6px 13px; cursor: pointer; border: 1px solid var(--line);
    background: transparent; color: var(--ink);
  }
  .pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #status-msg {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 13px; color: var(--muted);
    padding: 40px 0; text-align: center;
  }
  ul#list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li.card {
    display: flex; gap: 14px; background: var(--card); border-radius: 12px;
    border: 1px solid var(--line); padding: 14px;
  }
  .day-badge {
    flex-shrink: 0; width: 64px; border-radius: 9px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 10px 4px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .day-num { font-size: 22px; font-weight: 700; line-height: 1; font-family: Georgia, serif; }
  .day-unit { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
  .body { flex: 1; min-width: 0; }
  .top-row {
    display: flex; gap: 8px; margin-bottom: 4px; font-family: 'Helvetica Neue', Arial, sans-serif;
    flex-wrap: wrap;
  }
  .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .status-chip {
    font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--grey-bg); color: var(--grey-fg);
  }
  .status-chip.not-started { background: #FBEACB; color: #8A5A0A; }
  .status-chip.in-progress { background: #DDEBFF; color: #215AA8; }
  .status-chip.submitted { background: #DCEDE8; color: #2E6B5E; }
  .status-chip.expired { background: #E6E7EC; color: #5A5F6E; }
  .title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .org { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-family: 'Helvetica Neue', Arial, sans-serif; }
  .req {
    font-size: 12.5px; background: var(--paper); border-radius: 6px; padding: 6px 9px;
    margin-bottom: 8px; font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.4;
  }
  .link {
    font-size: 12px; font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink); text-decoration: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 9px; display: inline-block;
  }
  footer {
    text-align: center; margin-top: 40px; padding-top: 18px;
    border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Internships • Bursaries • Graduate Programmes</div>
      <h1>Opportunity Tracker</h1>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <span class="stat-number" id="totalCount">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="activeCount">0</span>
      <span class="stat-label">Active</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="submittedCount">0</span>
      <span class="stat-label">Submitted</span>
    </div>
    <div class="stat">
      <span class="stat-number" id="closingSoonCount">0</span>
      <span class="stat-label">Closing Soon</span>
    </div>
  </div>

  <div class="controls">
    <select id="sortSelect">
      <option value="deadline">Sort: closing soonest</option>
      <option value="added">Sort: newest added</option>
      <option value="title">Sort: title A–Z</option>
    </select>
    <input type="text" id="searchBox" placeholder="Search title or org…">
  </div>

  <div class="pill-row" id="statusPills">
    <button class="pill active" data-status="all">All</button>
    <button class="pill" data-status="Not started">Not started</button>
    <button class="pill" data-status="In progress">In progress</button>
    <button class="pill" data-status="Submitted">Submitted</button>
    <button class="pill" data-status="Expired">Expired</button>
  </div>

  <div id="status-msg">Loading opportunities…</div>
  <ul id="list"></ul>

  <footer>Opportunity Tracker v1.0 • sk518x</footer>
</div>

<script>
  const WEBHOOK_URL = "YOUR_N8N_WEBHOOK_URL_HERE";

  let allData = [];
  let currentStatus = "all";

  function daysLeft(deadline) {
    if (!deadline) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(deadline);
    return Math.round((d - today) / 86400000);
  }

  function urgencyStyle(days) {
    if (days === null) return { bg: "var(--grey-bg)", fg: "var(--grey-fg)" };
    if (days < 0) return { bg: "var(--grey-bg)", fg: "var(--grey-fg)" };
    if (days <= 3) return { bg: "var(--red-bg)", fg: "var(--red-fg)" };
    if (days <= 10) return { bg: "var(--amber-bg)", fg: "var(--amber-fg)" };
    return { bg: "var(--teal-bg)", fg: "var(--teal-fg)" };
  }

  function render() {
    const list = document.getElementById("list");
    const msg = document.getElementById("status-msg");
    const search = document.getElementById("searchBox").value.toLowerCase();
    const sortBy = document.getElementById("sortSelect").value;

    let items = allData.filter(o => currentStatus === "all" || o.status === currentStatus);
    if (search) {
      items = items.filter(o =>
        (o.title || "").toLowerCase().includes(search) ||
        (o.org || "").toLowerCase().includes(search)
      );
    }

    items.sort((a, b) => {
      if (sortBy === "deadline") {
        const da = a.deadline ? new Date(a.deadline) : new Date("9999-12-31");
        const db = b.deadline ? new Date(b.deadline) : new Date("9999-12-31");
        return da - db;
      }
      if (sortBy === "added") {
        return new Date(b.added_on) - new Date(a.added_on);
      }
      return (a.title || "").localeCompare(b.title || "");
    });

    if (items.length === 0) {
      msg.style.display = "block";
      msg.textContent = allData.length === 0 ? "No opportunities yet." : "Nothing matches this filter.";
      list.innerHTML = "";
      return;
    }
    msg.style.display = "none";

    list.innerHTML = items.map(o => {
      const d = daysLeft(o.deadline);
      const us = urgencyStyle(d);
      const dayLabel = d === null ? "—" : d < 0 ? "0" : d;
      const unitLabel = d === null ? "no date" : d < 0 ? "closed" : (d === 1 ? "day" : "days");
      return `
        <li class="card">
          <div class="day-badge" style="background:${us.bg};color:${us.fg}">
            <div class="day-num">${dayLabel}</div>
            <div class="day-unit">${unitLabel}</div>
          </div>
          <div class="body">
            <div class="top-row">
              <span class="tag">${escapeHtml(o.type || "Other")}</span>
              <span class="status-chip ${statusClass(o.status)}">${escapeHtml(o.status || "Not started")}</span>
            </div>
            <div class="title">${escapeHtml(o.title || "Untitled")}</div>
            <div class="org">${escapeHtml(o.org || "")}</div>
            ${o.requirements ? `<div class="req">${escapeHtml(o.requirements)}</div>` : ""}
            ${o.link ? `<a class="link" href="${escapeHtml(o.link)}" target="_blank" rel="noopener">View Opportunity →</a>` : ""}
          </div>
        </li>`;
    }).join("");
  }

  function statusClass(status) {
    const map = {
      "Not started": "not-started",
      "In progress": "in-progress",
      "Submitted": "submitted",
      "Expired": "expired"
    };
    return map[status] || "not-started";
  }

  function updateStats() {
    document.getElementById("totalCount").textContent = allData.length;
    document.getElementById("activeCount").textContent =
      allData.filter(o => o.status !== "Expired").length;
    document.getElementById("submittedCount").textContent =
      allData.filter(o => o.status === "Submitted").length;
    document.getElementById("closingSoonCount").textContent =
      allData.filter(o => {
        const d = daysLeft(o.deadline);
        return d !== null && d >= 0 && d <= 7;
      }).length;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  document.getElementById("statusPills").addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
    e.target.classList.add("active");
    currentStatus = e.target.dataset.status;
    render();
  });
  document.getElementById("sortSelect").addEventListener("change", render);
  document.getElementById("searchBox").addEventListener("input", render);

  fetch(WEBHOOK_URL)
    .then(r => {
      if (!r.ok) throw new Error("Request failed: " + r.status);
      return r.json();
    })
    .then(data => {
      allData = Array.isArray(data) ? data : [];
      updateStats();
      render();
    })
    .catch(err => {
      console.error(err);
      document.getElementById("status-msg").textContent =
        "Unable to load opportunities. Please refresh the page and try again.";
    });
</script>
</body>
</html>
